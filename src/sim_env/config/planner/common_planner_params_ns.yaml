# Namespace-friendly common params for global planner plugins.
# Load with: <rosparam ns="<GlobalPlannerInstance>" file=".../common_planner_params_ns.yaml" command="load" />

# offset of transform from world(x,y) to grid map(x,y)
convert_offset: 0.0
# error tolerance
default_tolerance: 0.0
# whether outline the map or not
outline_map: true
# obstacle inflation factor
obstacle_factor: 0.5
# whether publish expand zone or not
expand_zone: true
# safety corridor
show_safety_corridor: false
# let PathPlannerEngine::configurePlannerToolchain() decide per global_planner
auto_safety_corridor: true
